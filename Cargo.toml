[package]
name = "yearn-vote-notifications"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
eyre = "=0.6.14"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
sentry = { version = "=0.49.6", default-features = false, features = ["reqwest", "rustls", "tracing"] }
sha2 = "=0.11.1"
sonic-rs = "=0.5.12"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "fs", "sync"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"] }

[dev-dependencies]
chrono-tz = "=0.10.4"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
