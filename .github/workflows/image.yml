name: Image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# GHA caches are ref-isolated: PRs may read the base cache, but releases never
# import a PR cache. No registry credentials or package-write token on PRs.
concurrency:
  group: pr-ci-image.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: SatoshiAndKin/yearn-vote-notifications/.github/workflows/image-reviewed-linux.yml@f239b2a3d08f8f4c4196bc547a247fc00bde637c
