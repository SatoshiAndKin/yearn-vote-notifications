name: Security scan

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-security-scan.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    uses: SatoshiAndKin/brownie/.github/workflows/security-scan-reviewed-linux.yml@1ccea58cc915b21a4ae0019e1a877efb0ed2740c
