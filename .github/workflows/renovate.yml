name: Renovate runtime preview

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-ci-renovate.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  renovate:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: SatoshiAndKin/yearn-vote-notifications/.github/workflows/renovate-reviewed-linux.yml@05e3110abb6d5f5ad9775230782ef31ccdaaf039
